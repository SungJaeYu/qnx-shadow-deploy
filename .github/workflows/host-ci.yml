name: Host verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  host:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Configure with sanitizers
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DSHADOW_SANITIZERS=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Verify policy, real processes, and workbench API
        run: ctest --test-dir build --output-on-failure
      - name: Check JavaScript syntax
        run: node --check web/app.js
